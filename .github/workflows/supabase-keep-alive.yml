name: Supabase Keep-Alive

# Requête réelle sur la base tous les 3 jours (free tier : pause après 7 jours d'inactivité).
on:
  schedule:
    - cron: "0 8 */3 * *"
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Supabase (REST + Auth)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Secrets manquants: SUPABASE_URL et SUPABASE_PUBLISHABLE_KEY (ou SUPABASE_ANON_KEY)"
            exit 1
          fi

          BASE_URL="${SUPABASE_URL%/}"

          # Lecture sur la table users : génère une vraie activité Postgres.
          REST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$BASE_URL/rest/v1/users?select=id&limit=1")
          echo "REST status: $REST_STATUS"

          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 \
            -H "apikey: $SUPABASE_KEY" \
            "$BASE_URL/auth/v1/health")
          echo "Auth status: $AUTH_STATUS"

          # 401/403 = projet actif mais RLS/clé restrictive ; l'activité est tout de même comptée.
          case "$REST_STATUS" in
            200|401|403) ;;
            *) echo "::error::Supabase injoignable (REST $REST_STATUS), projet peut-être en pause"; exit 1 ;;
          esac

          echo "Supabase actif"
